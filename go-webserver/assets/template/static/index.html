<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <title data-i18n="app.title">&nbsp;</title>
  <link rel="icon" href="/favicon.ico" />
  <!-- Before the stylesheets paint, so a saved dark theme never flashes light. -->
  <script src="/js/theme.js"></script>
  <!-- Bootstrap 5 and its icon font, vendored (see /vendor/README.md), then
       this app's overrides on top. -->
  <link rel="stylesheet" href="/vendor/bootstrap.min.css" />
  <link rel="stylesheet" href="/vendor/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <a id="skip-link" href="#main" class="visually-hidden-focusable" data-i18n="nav.skip"></a>
  <!--
    No text is hardcoded here. Every visible string carries a data-i18n key
    that server/language resolves from language.yaml at runtime, so the copy
    can change (or be removed entirely) without editing this file.

    data-i18n replaces an element's text, so wherever an icon sits next to a
    label the key goes on an inner <span>, never on the element holding both.
  -->
  <nav class="navbar app-navbar border-bottom sticky-top" data-i18n-attr="aria-label:nav.top_label">
    <div class="container-fluid gap-2">
      <!-- The menu button, left, beside the sidebar it controls: on a phone it
           slides the sidebar in, on a wide screen it collapses and expands it
           (remembered in this browser). See Nav.toggleSidebar. -->
      <button id="sidebar-toggle" class="btn btn-link app-icon-button" type="button"
              aria-controls="sidebar" data-i18n-attr="aria-label:nav.menu,title:nav.menu" hidden>
        <i class="bi bi-list" aria-hidden="true"></i>
      </button>
      <!-- The app's name is the way home, from any screen. -->
      <a href="/" class="navbar-brand fw-semibold me-auto" data-i18n="app.title"></a>
      <span class="navbar-text small d-none d-md-inline" data-i18n="app.tagline"></span>
      <!-- >>> feature:!appearance -->
      <!-- Light/dark from anywhere. With the Appearance screen the choice
           lives there instead, so this button is left out. -->
      <button id="theme-toggle" class="btn btn-link app-icon-button" type="button"
              data-i18n-attr="aria-label:nav.theme_toggle,title:nav.theme_toggle">
        <i class="bi bi-moon-stars" aria-hidden="true"></i>
      </button>
      <!-- <<< feature:!appearance -->
      <div id="app-nav" class="d-flex align-items-center gap-2" hidden>
        <!-- The app's own top-level links go here. Your account is in the
             sidebar, not up here. -->
      </div>
    </div>
  </nav>

  <div class="app-shell">
    <!--
      Every signed-in screen is one entry here and one data-view section in
      <main>. nav.js shows the one the URL hash names, and hides an entry
      whose section the app left hidden (admin-only, switched off, ...).
      offcanvas-lg: a slide-in panel on a phone, a fixed column from lg up.
    -->
    <aside id="sidebar" class="offcanvas-lg offcanvas-start app-sidebar" tabindex="-1" aria-labelledby="sidebar-title" hidden>
      <div class="offcanvas-header border-bottom">
        <h2 class="offcanvas-title h5" id="sidebar-title" data-i18n="app.title"></h2>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" data-bs-target="#sidebar"
                data-i18n-attr="aria-label:nav.close"></button>
      </div>
      <div class="offcanvas-body">
        <nav id="sidebar-nav" class="nav nav-pills flex-column w-100 gap-1" data-i18n-attr="aria-label:nav.sidebar_label">
          <!-- Account, first: its second line names who is signed in (App.labelAccount). -->
          <a class="nav-link" href="#account" data-nav="account"><i class="bi bi-person-circle" aria-hidden="true"></i><span class="nav-link-text"><span data-i18n="nav.account"></span><span id="sidebar-user" class="nav-link-sub"></span></span></a>
          <a class="nav-link" href="#appearance" data-nav="appearance"><i class="bi bi-palette" aria-hidden="true"></i><span data-i18n="nav.appearance"></span></a> <!-- feature:appearance -->
          <a class="nav-link" href="#shortcuts" data-nav="shortcuts"><i class="bi bi-keyboard" aria-hidden="true"></i><span data-i18n="nav.shortcuts"></span></a> <!-- feature:shortcuts -->
          <a class="nav-link" href="#files" data-nav="files"><i class="bi bi-folder" aria-hidden="true"></i><span data-i18n="nav.files"></span></a> <!-- feature:files -->
          <a class="nav-link" href="#about" data-nav="about"><i class="bi bi-info-circle" aria-hidden="true"></i><span data-i18n="nav.about"></span></a> <!-- feature:about -->

          <div id="sidebar-admin" class="sidebar-group" hidden>
            <h3 class="sidebar-heading" data-i18n="nav.admin_heading"></h3>
            <a class="nav-link" href="#users" data-nav="users"><i class="bi bi-people" aria-hidden="true"></i><span data-i18n="nav.users"></span></a>
            <a class="nav-link" href="#invite-links" data-nav="invite-links"><i class="bi bi-link-45deg" aria-hidden="true"></i><span data-i18n="nav.invite_links"></span></a> <!-- feature:invite_links -->
            <a class="nav-link" href="#all-keys" data-nav="all-keys"><i class="bi bi-shield-lock" aria-hidden="true"></i><span data-i18n="nav.all_keys"></span></a> <!-- feature:api_keys -->
            <a class="nav-link" href="#logs" data-nav="logs"><i class="bi bi-journal-text" aria-hidden="true"></i><span data-i18n="nav.logs"></span></a> <!-- feature:logs -->
            <a class="nav-link" href="#jobs" data-nav="jobs"><i class="bi bi-clock-history" aria-hidden="true"></i><span data-i18n="nav.jobs"></span></a> <!-- feature:jobs -->
            <a class="nav-link" href="#webhooks" data-nav="webhooks"><i class="bi bi-broadcast" aria-hidden="true"></i><span data-i18n="nav.webhooks"></span></a> <!-- feature:webhooks -->
            <a class="nav-link" href="#settings" data-nav="settings"><i class="bi bi-sliders" aria-hidden="true"></i><span data-i18n="nav.settings"></span></a> <!-- feature:settings -->
          </div>
          <p id="sidebar-version" class="sidebar-version" hidden></p>
        </nav>
      </div>
    </aside>

    <main hidden id="main" class="app-main" tabindex="-1">
      <p id="maintenance-banner" class="alert alert-warning" role="status" hidden></p> <!-- feature:maintenance -->
      <!-- server.announcement, until dismissed. See App.showAnnouncement. -->
      <div id="announcement-banner" class="alert alert-info alert-dismissible" role="status" hidden>
        <span id="announcement-text"></span>
        <button id="announcement-dismiss" type="button" class="btn-close" data-i18n-attr="aria-label:nav.close"></button>
      </div>
      <div id="error-banner" class="alert alert-danger alert-dismissible" role="alert" hidden>
        <span id="error-banner-text"></span>
        <button id="error-copy-button" type="button" class="btn btn-sm btn-outline-danger ms-2" data-i18n="ui.copy"></button>
        <button type="button" class="btn-close" data-box-close="" data-i18n-attr="aria-label:nav.close"></button>
      </div>

      <!-- While the signed-in screens fetch what they show. See App.renderSignedIn. -->
      <div id="app-loading" class="app-loading" role="status" hidden>
        <span class="spinner-border" aria-hidden="true"></span>
        <span class="visually-hidden" data-i18n="ui.loading"></span>
      </div>

      <section id="signed-out" class="card" hidden>
        <div class="card-body">
          <h2 class="h4 card-title" data-i18n="signed_out.heading"></h2>
          <p data-i18n="signed_out.body"></p>
          <p id="invalid-link" class="alert alert-warning mb-0" data-i18n="signed_out.invalid_link" hidden></p>
          <p id="sign-in-expired" class="alert alert-warning mb-0" data-i18n="signed_out.sign_in_expired" hidden></p>
          <p id="session-ended" class="alert alert-warning mb-0" data-i18n="signed_out.session_ended" hidden></p>
          <!-- >>> feature:passwords -->

          <!-- Only while the owner has auth.passwords on; see password.js. -->
          <div id="password-login" class="mt-3" hidden>
            <h3 class="h6" data-i18n="signed_out.password_heading"></h3>
            <form id="password-login-form">
              <div class="mb-3">
                <label for="login-username" class="form-label" data-i18n="signed_out.username_label"></label>
                <input id="login-username" class="form-control" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="32" required />
              </div>
              <div class="mb-3">
                <label for="login-password" class="form-label" data-i18n="signed_out.password_label"></label>
                <input id="login-password" class="form-control" name="password" type="password" autocomplete="current-password" required />
              </div>
              <button id="password-login-button" type="submit" class="btn btn-primary" data-i18n="signed_out.password_button"></button>
            </form>
          </div>
          <!-- <<< feature:passwords -->
        </div>
      </section>

      <!-- >>> feature:two_factor -->
      <!-- Asked for during any sign-in on an account with two-factor on. See
           two_factor.js. -->
      <section id="two-factor-step" class="card" hidden>
        <div class="card-body">
          <h2 class="h4 card-title" data-i18n="two_factor.step_heading"></h2>
          <p data-i18n="two_factor.step_body"></p>
          <form id="two-factor-step-form" autocomplete="off">
            <div class="mb-3">
              <label for="two-factor-step-code" class="form-label" data-i18n="two_factor.code_label"></label>
              <input id="two-factor-step-code" class="form-control" name="code" autocomplete="one-time-code" autocapitalize="characters" spellcheck="false" maxlength="24" required />
            </div>
            <button type="submit" class="btn btn-primary" data-i18n="two_factor.step_button"></button>
          </form>
        </div>
      </section>

      <!-- <<< feature:two_factor -->
      <!-- What a login link opens. Nothing is redeemed until the button is
           pressed -- see renderLoginConfirm in app.js. -->
      <section id="login-confirm" class="card" hidden>
        <div class="card-body">
          <h2 class="h4 card-title" data-i18n="login_confirm.heading"></h2>
          <p data-i18n="login_confirm.body"></p>
          <p id="login-switch-warning" class="alert alert-warning" hidden></p>
          <button id="login-confirm-button" class="btn btn-primary" data-i18n="login_confirm.button"></button>
        </div>
      </section>

      <!-- >>> feature:invite_links -->
      <!-- What an invite link opens: type a name, then either pick yourself
           from "did you mean" or join as someone new. See join.js. -->
      <section id="join" class="card" hidden>
        <div class="card-body">
          <h2 id="join-heading" class="h4 card-title"></h2>
          <p id="join-invalid" class="alert alert-warning" data-i18n="join.invalid" hidden></p>
          <p id="join-switch-warning" class="alert alert-warning" hidden></p>

          <div id="join-name-step" hidden>
            <p data-i18n="join.body"></p>
            <form id="join-name-form" class="row g-3 align-items-end" autocomplete="off">
              <div class="col-md">
                <label for="join-name" class="form-label" data-i18n="join.name_label"></label>
                <input id="join-name" class="form-control" name="display_name" maxlength="80" required
                       data-i18n-attr="placeholder:join.name_placeholder" />
              </div>
              <div class="col-md-auto">
                <button type="submit" class="btn btn-primary" data-i18n="join.continue_button"></button>
              </div>
            </form>
          </div>

          <div id="join-choose" hidden>
            <p id="join-choose-heading"></p>
            <div id="join-matches" class="list-group mb-3"></div>
            <p id="join-full" class="text-body-secondary" data-i18n="join.full" hidden></p>
            <div class="row-actions">
              <button id="join-create-button" class="btn btn-primary"></button>
              <button id="join-back-button" class="btn btn-outline-secondary" data-i18n="join.back_button"></button>
            </div>
          </div>

          <div id="join-pin-step" hidden>
            <p id="join-pin-prompt"></p>
            <form id="join-pin-form" autocomplete="off">
              <div class="mb-3">
                <label for="join-pin" class="form-label" data-i18n="join.pin_label"></label>
                <input id="join-pin" class="form-control" name="pin" type="password" inputmode="numeric" maxlength="8" required />
              </div>
              <div class="row-actions">
                <button type="submit" class="btn btn-primary" data-i18n="join.pin_button"></button>
                <button type="button" id="join-pin-back-button" class="btn btn-outline-secondary" data-i18n="join.back_button"></button>
              </div>
            </form>
          </div>
        </div>
      </section>

      <!-- <<< feature:invite_links -->
      <!--
        Every signed-in screen is a <section class="view"> holding its heading
        and a stack of cards, one card per job: a form that makes something
        and the list it adds to are two cards, so each has its own edge. A
        screen that does one thing is one card.
      -->
      <section id="signed-in" hidden>
        <!-- Everything about you: who you are, how you sign in, and what can
             act as you. A feature's card stays hidden until its own JS shows it. -->
        <section class="view" data-view="account" id="account-panel">
          <h2 class="view-title" data-i18n="account.heading"></h2>


          <section class="card">
            <div class="card-body">
              <h3 class="card-title" data-i18n="account.profile_heading"></h3>
              <form id="rename-form" class="row g-3 align-items-end" autocomplete="off">
                <div class="col-md">
                  <label for="display-name" class="form-label" data-i18n="account.display_name_label"></label>
                  <input id="display-name" class="form-control" name="display_name" maxlength="80" required
                         data-i18n-attr="placeholder:account.display_name_placeholder" />
                </div>
                <div class="col-md-auto">
                  <button type="submit" class="btn btn-primary" data-i18n="account.save_button"></button>
                </div>
              </form>
            </div>
          </section>

          <!-- A login link for your own account, to sign in on another device.
               Any signed-in user may mint one; see Api.createMyLoginLink. -->
          <section class="card">
            <div class="card-body">
              <h3 class="card-title" data-i18n="account.device_heading"></h3>
              <p class="text-body-secondary" data-i18n="account.device_description"></p>
              <!-- The link you could still use, if any, and a way to stop it. -->
              <div id="my-live-link" class="d-flex flex-wrap align-items-center gap-2 mb-3" hidden>
                <span id="my-live-link-text" class="text-body-secondary"></span>
                <button id="my-link-cancel-button" class="btn btn-sm btn-outline-danger" data-i18n="login_links.cancel_button"></button>
              </div>
              <button id="my-link-button" class="btn btn-outline-secondary" data-i18n="account.device_button"></button>
              <div id="my-link-box" class="alert alert-info alert-dismissible mt-3 mb-0" hidden>
                <button type="button" class="btn-close" data-box-close="my-link-button" data-i18n-attr="aria-label:nav.close"></button>
                <p id="my-link-notice" class="mb-2"></p>
                <div class="link-box">
                  <code id="my-link-value"></code>
                  <button id="my-link-copy-button" class="btn btn-sm btn-outline-secondary" data-i18n="account.copy_button"></button>
                  <button id="my-link-qr-button" class="btn btn-sm btn-outline-secondary" data-i18n="ui.qr_button"></button>
                </div>
                <canvas id="my-link-qr" class="link-qr" role="img" data-i18n-attr="aria-label:ui.qr_label" hidden></canvas>
              </div>
            </div>
          </section>

          <!-- >>> feature:passwords -->
          <!-- Only while the owner has auth.passwords on; see password.js. -->
          <section class="card" id="password-panel" hidden>
            <div class="card-body">
              <h3 class="card-title" data-i18n="password.heading"></h3>
              <p class="text-body-secondary" data-i18n="password.description"></p>
              <p><span id="password-status" class="badge text-bg-secondary"></span></p>
              <form id="password-form">
                <div class="mb-3">
                  <label for="password-username" class="form-label" data-i18n="password.username_label"></label>
                  <input id="password-username" class="form-control" name="username" autocomplete="username" autocapitalize="none" spellcheck="false"
                         minlength="3" maxlength="32" pattern="[A-Za-z0-9._\-]{3,32}" required />
                  <div class="form-text" data-i18n="password.username_help"></div>
                </div>
                <div class="mb-3">
                  <label for="password-new" class="form-label" data-i18n="password.new_label"></label>
                  <input id="password-new" class="form-control" name="new_password" type="password" autocomplete="new-password" required />
                  <div class="form-text" data-i18n="password.new_help"></div>
                </div>
                <div class="mb-3">
                  <label for="password-confirm" class="form-label" data-i18n="password.confirm_label"></label>
                  <input id="password-confirm" class="form-control" name="confirm_password" type="password" autocomplete="new-password" required />
                </div>
                <!-- >>> feature:two_factor -->
                <div id="password-code-row" class="mb-3" hidden>
                  <label for="password-code" class="form-label" data-i18n="two_factor.code_label"></label>
                  <input id="password-code" class="form-control" name="code" autocomplete="one-time-code" spellcheck="false" maxlength="24" />
                </div>
                <!-- <<< feature:two_factor -->
                <div class="row-actions">
                  <button type="submit" class="btn btn-primary" data-i18n="password.save_button"></button>
                  <button type="button" id="password-remove-button" class="btn btn-outline-danger" data-i18n="password.remove_button" hidden></button>
                </div>
              </form>
            </div>
          </section>

          <!-- <<< feature:passwords -->
          <!-- >>> feature:invite_links -->
          <!-- Only for non-admin accounts; see pin.js. -->
          <section class="card" id="pin-panel" hidden>
            <div class="card-body">
              <h3 class="card-title" data-i18n="pin.heading"></h3>
              <p class="text-body-secondary" data-i18n="pin.description"></p>
              <p><span id="pin-status" class="badge text-bg-secondary"></span></p>
              <form id="pin-form" autocomplete="off">
                <div class="mb-3">
                  <label for="pin-value" class="form-label" data-i18n="pin.label"></label>
                  <input id="pin-value" class="form-control" name="pin" type="password" inputmode="numeric" minlength="4" maxlength="8"
                         pattern="[0-9]{4,8}" required data-i18n-attr="placeholder:pin.placeholder" />
                </div>
                <div class="row-actions">
                  <button type="submit" class="btn btn-primary" data-i18n="pin.save_button"></button>
                  <button type="button" id="pin-clear-button" class="btn btn-outline-danger" data-i18n="pin.clear_button" hidden></button>
                </div>
              </form>
            </div>
          </section>

          <!-- <<< feature:invite_links -->
          <!-- >>> feature:two_factor -->
          <!-- Only while the owner has auth.two_factor on; see two_factor.js. -->
          <section class="card" id="two-factor-panel" hidden>
            <div class="card-body">
              <h3 class="card-title" data-i18n="two_factor.heading"></h3>
              <p class="text-body-secondary" data-i18n="two_factor.description"></p>
              <p><span id="two-factor-status" class="badge text-bg-secondary"></span></p>
              <button id="two-factor-start-button" class="btn btn-primary" data-i18n="two_factor.start_button" hidden></button>

              <div id="two-factor-setup" hidden>
                <p data-i18n="two_factor.setup_scan"></p>
                <canvas id="two-factor-qr" class="d-block img-fluid mb-3 border rounded" role="img" data-i18n-attr="aria-label:ui.qr_label"></canvas>
                <p class="mb-1" data-i18n="two_factor.setup_manual"></p>
                <div class="link-box mb-3">
                  <code id="two-factor-secret"></code>
                  <button id="two-factor-secret-copy" type="button" class="btn btn-sm btn-outline-secondary" data-i18n="two_factor.copy_secret_button"></button>
                </div>
                <form id="two-factor-confirm-form" autocomplete="off">
                  <div class="mb-3">
                    <label for="two-factor-code" class="form-label" data-i18n="two_factor.setup_code_label"></label>
                    <input id="two-factor-code" class="form-control" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required />
                  </div>
                  <button type="submit" class="btn btn-primary" data-i18n="two_factor.confirm_button"></button>
                </form>
              </div>

              <div id="two-factor-recovery" class="alert alert-info" hidden>
                <p data-i18n="two_factor.recovery_notice"></p>
                <pre id="two-factor-recovery-codes" class="mb-3"></pre>
                <div class="row-actions">
                  <button id="two-factor-recovery-copy" class="btn btn-sm btn-outline-secondary" data-i18n="two_factor.copy_button"></button>
                  <button id="two-factor-recovery-download" class="btn btn-sm btn-outline-secondary" data-i18n="two_factor.download_button"></button>
                  <button id="two-factor-recovery-done" class="btn btn-sm btn-primary" data-i18n="two_factor.done_button"></button>
                </div>
              </div>

              <form id="two-factor-disable-form" autocomplete="off" hidden>
                <div class="mb-3">
                  <label for="two-factor-disable-code" class="form-label" data-i18n="two_factor.code_label"></label>
                  <input id="two-factor-disable-code" class="form-control" name="code" autocomplete="one-time-code" spellcheck="false" maxlength="24" required />
                </div>
                <button type="submit" class="btn btn-outline-danger" data-i18n="two_factor.disable_button"></button>
              </form>
            </div>
          </section>

          <!-- <<< feature:two_factor -->
          <!-- >>> feature:api_keys -->
          <!--
            API keys: the non-browser way in, for every signed-in user. The role
            select is revealed only for an admin (see keys.js) because a key can
            never carry more permission than the account that owns it.
          -->
          <section class="card" id="api-keys-panel" hidden>
            <div class="card-body">
              <h3 class="card-title" data-i18n="api_keys.heading"></h3>
              <p class="text-body-secondary" data-i18n="api_keys.description"></p>
              <!-- >>> feature:openapi -->
              <p id="key-spec-line" class="small" hidden>
                <span data-i18n="api_keys.spec_text"></span>
                <a id="key-spec-link" target="_blank" rel="noopener noreferrer" data-i18n="api_keys.spec_link"></a>
              </p>
              <!-- <<< feature:openapi -->

              <form id="create-key-form" class="row g-3 align-items-end" autocomplete="off">
                <div class="col-md">
                  <label for="key-name" class="form-label" data-i18n="api_keys.name_label"></label>
                  <input id="key-name" class="form-control" name="name" maxlength="80" required
                         data-i18n-attr="placeholder:api_keys.name_placeholder" />
                </div>
                <div class="col-md" id="key-role-field" hidden>
                  <label for="key-role" class="form-label" data-i18n="api_keys.role_label"></label>
                  <select id="key-role" class="form-select" name="role">
                    <option value="user" data-i18n="api_keys.role_user"></option>
                    <option value="admin" data-i18n="api_keys.role_admin"></option>
                  </select>
                </div>
                <div class="col-md">
                  <label for="key-days" class="form-label" data-i18n="api_keys.days_label"></label>
                  <input id="key-days" class="form-control" name="expires_in_days" type="number" min="0" max="3650" inputmode="numeric"
                         data-i18n-attr="placeholder:api_keys.days_placeholder" />
                </div>
                <div class="col-md-auto">
                  <button type="submit" class="btn btn-primary" data-i18n="api_keys.create_button"></button>
                </div>
              </form>

              <div id="key-secret-box" class="alert alert-info alert-dismissible mt-3" hidden>
                <button type="button" class="btn-close" data-box-close="key-name" data-i18n-attr="aria-label:nav.close"></button>
                <p class="mb-2" data-i18n="api_keys.secret_notice"></p>
                <div class="link-box">

        <!-- The activity log, owner only; see logs.js. data-no-track keeps

                          <button type="button" id="logs-cal-next" class="btn btn-sm btn-outline-secondary" data-i18n-attr="aria-label:logs.next_month,title:logs.next_month">
