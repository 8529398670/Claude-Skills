<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title data-i18n="app.title">&nbsp;</title>
  <!-- Before the stylesheet paints, so a saved dark theme never flashes light. -->
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <!--
    No text is hardcoded here. Every visible string carries a data-i18n key
    that server/language resolves from language.yaml at runtime, so the copy
    can change (or be removed entirely) without editing this file.
  -->
  <header class="app-header">
    <div>
      <!-- The app's name is the way home, from any screen. -->
      <h1><a href="/" class="brand-link" data-i18n="app.title"></a></h1>
      <p class="muted" data-i18n="app.tagline"></p>
    </div>
    <div class="header-side">
      <nav id="app-nav" class="app-nav" hidden>
        <!-- The app's own top-level links go here, before the profile icon. -->
        <!-- Your account and settings, behind the usual profile icon. Its
             title says who is signed in; see App.labelProfile. -->
        <a href="#account" id="profile-link" class="profile-link"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="8.5" r="4"/><path d="M4 20.5c0-4.1 3.6-6.5 8-6.5s8 2.4 8 6.5"/></svg></a>
      </nav>
    </div>
  </header>

  <main hidden id="main">
    <section id="signed-out" class="card" hidden>
      <h2 data-i18n="signed_out.heading"></h2>
      <p data-i18n="signed_out.body"></p>
      <p id="invalid-link" class="notice notice-warn" data-i18n="signed_out.invalid_link" hidden></p>
    </section>

    <!-- What a login link opens. Nothing is redeemed until the button is
         pressed -- see renderLoginConfirm in app.js. -->
    <section id="login-confirm" class="card" hidden>
      <h2 data-i18n="login_confirm.heading"></h2>
      <p data-i18n="login_confirm.body"></p>
      <p id="login-switch-warning" class="notice notice-warn" hidden></p>
      <button id="login-confirm-button" data-i18n="login_confirm.button"></button>
    </section>

    <!-- What an invite link opens: type a name, then either pick yourself
         from "did you mean" or join as someone new. See join.js. -->
    <section id="join" class="card" hidden>
      <h2 id="join-heading"></h2>
      <p id="join-invalid" class="notice notice-warn" data-i18n="join.invalid" hidden></p>
      <p id="join-switch-warning" class="notice notice-warn" hidden></p>

      <div id="join-name-step" hidden>
        <p data-i18n="join.body"></p>
        <form id="join-name-form" autocomplete="off">
          <div class="field">
            <label for="join-name" data-i18n="join.name_label"></label>
            <input id="join-name" name="display_name" maxlength="80" required
                   data-i18n-attr="placeholder:join.name_placeholder" />
          </div>
          <button type="submit" data-i18n="join.continue_button"></button>
        </form>
      </div>

      <div id="join-choose" hidden>
        <p id="join-choose-heading"></p>
        <div id="join-matches" class="choice-list"></div>
        <p id="join-full" class="muted" data-i18n="join.full" hidden></p>
        <div class="row-actions">
          <button id="join-create-button"></button>
          <button id="join-back-button" class="secondary" data-i18n="join.back_button"></button>
        </div>
      </div>

      <div id="join-pin-step" hidden>
        <p id="join-pin-prompt"></p>
        <form id="join-pin-form" autocomplete="off">
          <div class="field">
            <label for="join-pin" data-i18n="join.pin_label"></label>
            <input id="join-pin" name="pin" type="password" inputmode="numeric" maxlength="8" required />
          </div>
          <div class="row-actions">
            <button type="submit" data-i18n="join.pin_button"></button>
            <button type="button" id="join-pin-back-button" class="secondary" data-i18n="join.back_button"></button>
          </div>
        </form>
      </div>
    </section>

    <section id="signed-in" hidden>
      <div class="card" id="account">
        <h2 data-i18n="account.heading"></h2>
        <form id="rename-form" autocomplete="off">
          <div class="field">
            <label for="display-name" data-i18n="account.display_name_label"></label>
            <input id="display-name" name="display_name" maxlength="80" required
                   data-i18n-attr="placeholder:account.display_name_placeholder" />
          </div>
          <button type="submit" data-i18n="account.save_button"></button>
        </form>

        <!-- A login link for your own account, to sign in on another device.
             Any signed-in user may mint one; see Api.createMyLoginLink. -->
        <h3 data-i18n="account.device_heading"></h3>
        <p class="muted" data-i18n="account.device_description"></p>
        <button id="my-link-button" class="secondary" data-i18n="account.device_button"></button>
        <div id="my-link-box" class="notice notice-link" hidden>
          <p data-i18n="account.device_link_notice"></p>
          <code id="my-link-value"></code>
          <button id="my-link-copy-button" class="secondary" data-i18n="account.copy_button"></button>
        </div>

        <button id="logout-button" class="secondary" data-i18n="account.logout_button"></button>
      </div>

      <!-- Light, dark, or a ready-made theme; kept in this browser. See
           theme.js. Folded to a line naming the current one. -->
      <details class="card collapsible" id="appearance">
        <summary>
          <span class="collapsible-head">
            <h2 data-i18n="theme.heading"></h2>
            <span id="theme-summary" class="muted"></span>
          </span>
        </summary>
        <p class="muted" data-i18n="theme.description"></p>
        <div id="theme-picker" class="theme-picker"></div>
      </details>

      <!-- Only for non-admin accounts; see pin.js. -->
      <details class="card collapsible" id="pin-panel" hidden>
        <summary>
          <span class="collapsible-head">
            <h2 data-i18n="pin.heading"></h2>
            <span id="pin-status" class="muted"></span>
          </span>
        </summary>
        <p class="muted" data-i18n="pin.description"></p>
        <form id="pin-form" autocomplete="off">
          <div class="field">
            <label for="pin-value" data-i18n="pin.label"></label>
            <input id="pin-value" name="pin" type="password" inputmode="numeric" minlength="4" maxlength="8"
                   pattern="[0-9]{4,8}" required data-i18n-attr="placeholder:pin.placeholder" />
          </div>
          <div class="row-actions">
            <button type="submit" data-i18n="pin.save_button"></button>
            <button type="button" id="pin-clear-button" class="secondary" data-i18n="pin.clear_button" hidden></button>
          </div>
        </form>
      </details>

      <!--
        API keys: the non-browser way in, for every signed-in user. The role
        select is revealed only for an admin (see keys.js) because a key can
        never carry more permission than the account that owns it.
      -->
      <details class="card collapsible" id="api-keys-panel" hidden>
        <summary>
          <span class="collapsible-head">
            <h2 data-i18n="api_keys.heading"></h2>
            <span class="muted" data-i18n="api_keys.summary"></span>
          </span>
        </summary>
        <p class="muted" data-i18n="api_keys.description"></p>

        <form id="create-key-form" autocomplete="off">
          <div class="field">
            <label for="key-name" data-i18n="api_keys.name_label"></label>
            <input id="key-name" name="name" maxlength="80" required
                   data-i18n-attr="placeholder:api_keys.name_placeholder" />
          </div>
          <div class="field" id="key-role-field" hidden>
            <label for="key-role" data-i18n="api_keys.role_label"></label>
            <select id="key-role" name="role">
              <option value="user" data-i18n="api_keys.role_user"></option>
              <option value="admin" data-i18n="api_keys.role_admin"></option>
            </select>
          </div>
          <div class="field">
            <label for="key-days" data-i18n="api_keys.days_label"></label>
            <input id="key-days" name="expires_in_days" type="number" min="0" max="3650" inputmode="numeric"
                   data-i18n-attr="placeholder:api_keys.days_placeholder" />
          </div>
          <button type="submit" data-i18n="api_keys.create_button"></button>
        </form>

        <div id="key-secret-box" class="notice notice-link" hidden>
          <p data-i18n="api_keys.secret_notice"></p>
          <code id="key-secret-value"></code>
          <button id="copy-key-button" class="secondary" data-i18n="api_keys.copy_button"></button>
        </div>

        <div class="table-scroll">
          <table id="keys-table">
            <thead>
              <tr>
                <th data-i18n="api_keys.table_name"></th>
                <th data-i18n="api_keys.table_role"></th>
                <th data-i18n="api_keys.table_status"></th>
                <th data-i18n="api_keys.table_last_used"></th>
                <th data-i18n="api_keys.table_expires"></th>
                <th data-i18n="api_keys.table_actions"></th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </details>

      <div class="card" id="admin-panel" hidden>
        <h2 data-i18n="admin.heading"></h2>
        <p class="muted" data-i18n="admin.description"></p>

        <form id="create-user-form" autocomplete="off">
          <div class="field">
            <label for="new-name" data-i18n="admin.new_name_label"></label>
            <input id="new-name" name="display_name" maxlength="80" required
                   data-i18n-attr="placeholder:admin.new_name_placeholder" />
          </div>
          <div class="field">
            <label for="new-role" data-i18n="admin.new_role_label"></label>
            <select id="new-role" name="role">
              <option value="user" data-i18n="admin.role_user"></option>
              <option value="admin" data-i18n="admin.role_admin"></option>
            </select>
          </div>
          <button type="submit" data-i18n="admin.create_button"></button>
        </form>

        <div id="login-link-box" class="notice notice-link" hidden>
          <p data-i18n="admin.link_notice"></p>
          <code id="login-link-value"></code>
          <button id="copy-link-button" class="secondary" data-i18n="admin.copy_button"></button>
        </div>

        <div class="table-scroll">
          <table id="users-table">
            <thead>
              <tr>
                <th data-i18n="admin.table_name"></th>
                <th data-i18n="admin.table_role"></th>
                <th data-i18n="admin.table_status"></th>
                <th data-i18n="admin.table_actions"></th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>

      <!-- One link a whole group can join through; see invites.js. -->
      <details class="card collapsible" id="invite-links-panel" hidden>
        <summary>
          <span class="collapsible-head">
            <h2 data-i18n="invite_links.heading"></h2>
            <span class="muted" data-i18n="invite_links.summary"></span>
          </span>
        </summary>
        <p class="muted" data-i18n="invite_links.description"></p>

        <form id="create-invite-form" autocomplete="off">
          <div class="field">
            <label for="invite-label" data-i18n="invite_links.label_label"></label>
            <input id="invite-label" name="label" maxlength="80" required
                   data-i18n-attr="placeholder:invite_links.label_placeholder" />
          </div>
          <div class="field">
            <label for="invite-uses" data-i18n="invite_links.uses_label"></label>
            <input id="invite-uses" name="max_uses" type="number" min="1" max="1000" value="10" required inputmode="numeric" />
          </div>
          <div class="field">
            <label for="invite-days" data-i18n="invite_links.days_label"></label>
            <input id="invite-days" name="days" type="number" min="1" max="365" value="30" required inputmode="numeric" />
          </div>
          <button type="submit" data-i18n="invite_links.create_button"></button>
        </form>

        <div id="invite-link-box" class="notice notice-link" hidden>
          <p data-i18n="invite_links.link_notice"></p>
          <code id="invite-link-value"></code>
          <button id="copy-invite-button" class="secondary" data-i18n="invite_links.copy_button"></button>
        </div>

        <div class="table-scroll">
          <table id="invite-links-table">
            <thead>
              <tr>
                <th data-i18n="invite_links.table_label"></th>
                <th data-i18n="invite_links.table_joined"></th>
                <th data-i18n="invite_links.table_status"></th>
                <th data-i18n="invite_links.table_expires"></th>
                <th data-i18n="invite_links.table_actions"></th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </details>

      <!-- Every key in the app, whoever owns it: the admin answer to "what
           has standing access", and where a lost laptop's key gets killed. -->
      <details class="card collapsible" id="admin-keys-panel" hidden>
        <summary>
          <span class="collapsible-head">
            <h2 data-i18n="admin_keys.heading"></h2>
            <span class="muted" data-i18n="admin_keys.summary"></span>
          </span>
        </summary>
        <p class="muted" data-i18n="admin_keys.description"></p>

        <div class="table-scroll">
          <table id="admin-keys-table">
            <thead>
              <tr>
                <th data-i18n="admin_keys.table_owner"></th>
                <th data-i18n="api_keys.table_name"></th>
                <th data-i18n="api_keys.table_role"></th>
                <th data-i18n="api_keys.table_status"></th>
                <th data-i18n="api_keys.table_last_used"></th>
                <th data-i18n="api_keys.table_actions"></th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </details>
    </section>

    <p id="error-banner" class="notice notice-error" hidden></p>
  </main>
  <!-- "Saved.", "Copied.": see Dom.toast. -->
  <p id="toast" class="notice toast" role="status" hidden></p>

  <!--
    Plain scripts in dependency order. No bundler, no modules that need a
    build step: each file adds one global and the browser runs them as-is.
    Third-party libraries go in /vendor/ (downloaded once, served by us) so
    the Content-Security-Policy can stay locked to 'self'.
  -->
  <script src="/js/dom.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/keys.js"></script>
  <script src="/js/join.js"></script>
  <script src="/js/pin.js"></script>
  <script src="/js/invites.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
