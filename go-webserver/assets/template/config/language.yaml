# Every piece of text the UI can show lives here, and nowhere else.
#
# Two rules make this useful rather than just indirection:
#
#   1. Translating or rewording the app is an edit to this file plus a
#      restart. No HTML or JS changes, no rebuild.
#   2. A key that is missing or empty ("") hides its element entirely. That
#      is how you turn a label, a button, or a whole section off without
#      touching the markup -- set it to "" and it disappears rather than
#      rendering blank or showing a raw key name.
#
# This file is served to any visitor at /api/language, signed in or not, since
# the signed-out page needs text too. Never put anything secret in it.

app:
  title: "{{PROJECT_NAME}}"
  tagline: "Sign in with a one-time link."

# The sidebar, one entry per signed-in screen. menu labels the header's
# button that opens/collapses it.
nav:
  menu: "Menu"
  close: "Close"
  account: "Account"
  appearance: "Appearance"
  pin: "PIN"
  api_keys: "API keys"
  admin_heading: "Admin"
  users: "Users"
  invite_links: "Invite links"
  all_keys: "All API keys"

# Short confirmations shown as a toast at the bottom of the screen.
ui:
  saved: "Saved."
  copied: "Copied."

# The Appearance card. Light is always the default; a pick is remembered in
# this browser only. Names for the presets in static/js/theme.js.
theme:
  heading: "Appearance"
  description: "Pick how this app looks in this browser."
  preset_light: "Light"
  preset_dark: "Dark"
  preset_ocean: "Ocean"
  preset_forest: "Forest"
  preset_sepia: "Sepia"
  preset_grape: "Grape"
  preset_pink: "Pink"
  preset_midnight: "Midnight"
  preset_slate: "Slate"
  preset_dark_pink: "Dark pink"

signed_out:
  heading: "You are not signed in"
  body: "There is no signup form here on purpose. Ask an admin for a one-time login link, or for your group's invite link."
  invalid_link: "That login link is invalid, expired, or has already been used. Ask for a new one."

login_confirm:
  heading: "Sign in"
  body: "This is a one-time login link. It stops working once you use it."
  # {name} is replaced with the account currently signed in.
  switch_warning: "You are signed in as {name}. Continuing signs you out of that account and into the one this link is for."
  button: "Sign in"

# What an invite link opens (/join/...). Nothing is created until a button
# is pressed. {label} is the link's label, {name} the name typed or picked.
join:
  heading: "Join {label}"
  body: "Type your name. If you have joined through this link before, type the same name to sign back in on this device."
  name_label: "Your name"
  name_placeholder: "Your name"
  continue_button: "Continue"
  did_you_mean: "Is one of these you?"
  no_match: "Nobody with a name like that has joined through this link yet."
  this_is_me: "That's me"
  has_pin: "PIN"
  create_new: "No, I'm new -- join as {name}"
  create_first: "Join as {name}"
  full: "This link has no places left. You can still sign back in if you joined through it before."
  back_button: "Back"
  pin_prompt: "Enter the PIN for {name}."
  pin_label: "PIN"
  pin_button: "Sign in"
  switch_warning: "You are signed in as {name}. Continuing signs you out of that account."
  invalid_heading: "This link is not working"
  invalid: "This invite link is invalid, expired, or has been switched off. Ask whoever shared it for a new one."

account:
  heading: "Account"
  display_name_label: "Display name"
  display_name_placeholder: "Your name"
  save_button: "Save"
  logout_button: "Log out"
  device_heading: "Sign in on another device"
  device_description: "Make a one-time login link for your own account and open it on your phone or another computer. Making a new one cancels any earlier link you have not used yet; devices already signed in stay signed in."
  device_button: "Make a login link"
  device_link_notice: "Open this on the other device. It works once."
  copy_button: "Copy"

admin:
  heading: "Admin"
  description: "Create an account by minting a login link. Send the link to the person; it works once."
  new_name_label: "Name"
  new_name_placeholder: "Their name"
  new_role_label: "Role"
  role_user: "user"
  role_admin: "admin"
  create_button: "Create login link"
  link_notice: "Send this one-time link. It is shown once and cannot be recovered, and any earlier unused link for this person has stopped working."
  copy_button: "Copy"
  table_name: "Name"
  table_role: "Role"
  table_status: "Status"
  table_actions: "Actions"
  status_active: "active"
  status_disabled: "disabled"
  reissue_button: "New link"
  revoke_button: "Revoke access"
  # {name} is replaced with the account's display name.
  revoke_confirm: "End every session, unused login link and API key that {name} has? The account stays enabled; send them a new link to let them back in."
  disable_button: "Disable"
  enable_button: "Enable"
  delete_button: "Delete"
  # Empty this string to stop asking for confirmation before deleting.
  delete_confirm: "Permanently delete {name}? Their sessions, login links and API keys go with the account, and it cannot be undone. Disable the account instead if they might come back."
  # Shown after the role of the one owner account, e.g. "admin (owner)".
  owner_label: "owner"

api_keys:
  heading: "API keys"
  description: "For scripts, cron jobs, and other services. A key does exactly what your account can do -- send it as an Authorization: Bearer header. It is shown once."
  name_label: "What is it for"
  name_placeholder: "deploy bot"
  role_label: "Permission"
  role_user: "user"
  role_admin: "admin (can manage accounts)"
  days_label: "Expires in (days)"
  days_placeholder: "leave blank for the default, 0 for never"
  create_button: "Create key"
  secret_notice: "Copy this now. It is shown once and cannot be recovered -- if you lose it, revoke the key and create another."
  copy_button: "Copy"
  table_name: "Name"
  table_role: "Permission"
  table_status: "Status"
  table_last_used: "Last used"
  table_expires: "Expires"
  table_actions: "Actions"
  status_active: "active"
  status_revoked: "revoked"
  status_expired: "expired"
  never: "never"
  revoke_button: "Revoke"
  # Empty this string to stop asking for confirmation before revoking.
  revoke_confirm: "Revoke this key? Anything using it stops working immediately."
  delete_button: "Delete"
  # Empty this string to stop asking for confirmation before deleting.
  delete_confirm: "Delete this key permanently? Anything using it stops working immediately, and it disappears from the list."

# Only offered to non-admin accounts: an admin can never be signed in to
# through an invite link, so a PIN would protect nothing.
pin:
  heading: "PIN"
  description: "If you joined through an invite link, anyone else holding that link could pick your name and sign in as you. Set a PIN and it will be asked for. Nothing else uses it."
  status_set: "A PIN is set."
  status_none: "No PIN is set."
  label: "New PIN"
  placeholder: "4 to 8 digits"
  save_button: "Set PIN"
  clear_button: "Remove PIN"

invite_links:
  heading: "Invite links"
  description: "One link for a group: post it in a group chat and each person who opens it joins as a new user, until the places run out. People who joined through it can sign back in on a new device with the same link."
  label_label: "What is it for"
  label_placeholder: "Group-1"
  uses_label: "Places"
  days_label: "Works for (days)"
  create_button: "Create invite link"
  link_notice: "Share this link with the group. It is shown once and cannot be recovered. Anyone holding it can join, so switch it off below if it goes somewhere it should not."
  copy_button: "Copy"
  table_label: "Link"
  table_joined: "Joined"
  table_status: "Status"
  table_expires: "Expires"
  table_actions: "Actions"
  # {used} and {max} are numbers.
  joined_of: "{used} of {max}"
  status_live: "live"
  status_full: "full"
  status_expired: "expired"
  status_revoked: "switched off"
  # The admin who made it was disabled, deleted, or is no longer an admin.
  status_orphaned: "maker no longer an admin"
  revoke_button: "Switch off"
  # Empty this string to stop asking for confirmation.
  revoke_confirm: "Switch off this link? Nobody can join or sign back in through it any more. Accounts it made keep working."
  delete_button: "Delete"
  # Empty this string to stop asking for confirmation.
  delete_confirm: "Delete this link from the list? It stops working if it has not already. Accounts it made stay."

admin_keys:
  heading: "All API keys"
  description: "Every key in this app and who owns it. Revoke or delete one to cut off whatever is using it, right away."
  table_owner: "Owner"

errors:
  generic: "Something went wrong. Please try again."
  network: "Could not reach the server."
  # Error codes the invite link and PIN routes answer with, by name.
  invite_link_invalid: "This invite link is invalid, expired, or has been switched off."
  invite_link_full: "This link has no places left."
  no_such_account: "That account cannot sign in through this link."
  pin_needed: "Enter the PIN."
  pin_wrong: "That PIN is not right."
  pin_locked: "Too many wrong PINs. Try again in 15 minutes."
  bad_pin: "A PIN is 4 to 8 digits."
