  theme_new: "new theme"
  theme_copy: "theme duplicated"
  theme_delete: "theme deleted"
  theme_rename: "theme renamed"
  theme_color: "color change"
  theme_button: "button style change"
  theme_reset: "colors reset"
  theme_defaults_mine: "back to the default themes"
  theme_defaults: "default themes change"
  # <<< feature:appearance
  shortcuts: "shortcut change" # feature:shortcuts
  ip_name: "address name deleted" # feature:logs
  sidebar: "sidebar"
  rename: "name changed"
  rename_key: "API key name changed" # feature:api_keys
  rename_invite: "invite link label changed" # feature:invite_links
  rename_webhook: "webhook name changed" # feature:webhooks
