# Every piece of text the UI can show lives here, and nowhere else.
#
# Two rules make this useful rather than just indirection:
#
#   1. Translating or rewording the app is an edit to this file plus a
#      restart. No HTML or JS changes, no rebuild.
#   2. A key that is missing or empty ("") hides its element entirely. That
#      is how you turn a label, a button, or a whole section off without
#      touching the markup -- set it to "" and it disappears rather than
#      rendering blank or showing a raw key name.
#
# This file is served to any visitor at /api/language, signed in or not, since
# the signed-out page needs text too. Never put anything secret in it.

app:
  title: "{{PROJECT_NAME}}"
  tagline: "Sign in with a login link."

# The sidebar, one entry per signed-in screen. menu labels the header's
# button that opens/collapses it.
nav:
  menu: "Menu"
  close: "Close"
  skip: "Skip to content"
  theme_toggle: "Switch between light and dark" # feature:!appearance
  # What a screen reader calls the two sets of links.
  top_label: "Top bar"
  sidebar_label: "Screens"
  # The browser tab, per screen. {screen} is the screen's heading.
  page_title: "{screen} · {app}"
  # Foot of the sidebar, for admins.
  version: "Version {version}"
  account: "Account"
  appearance: "Appearance" # feature:appearance
  shortcuts: "Shortcuts" # feature:shortcuts
  files: "Files" # feature:files
  about: "About" # feature:about
  admin_heading: "Admin"
  users: "Users"
  invite_links: "Invite links" # feature:invite_links
  all_keys: "All API keys" # feature:api_keys
  logs: "Logs" # feature:logs
  jobs: "Jobs" # feature:jobs
  webhooks: "Webhooks" # feature:webhooks
  settings: "Settings" # feature:settings

# Short confirmations shown as a toast at the bottom of the screen.
ui:
  saved: "Saved."
  copied: "Copied."
  copy: "Copy"
  # The ... button on a table row. {name} is the row.
  more_actions: "More actions for {name}"
  # Saving something that has not changed.
  unchanged: "Nothing to save."
  # Where the browser refuses to copy (plain http), the text is selected instead.
  copy_hint: "Selected. Press Ctrl+C, or Cmd+C on a Mac, to copy."
  load_more: "Load more"
  no_matches: "Nothing matches."
  loading: "Loading"
  cancel: "Cancel"
  save: "Save"
  # The name a screen reader gives a value that edits in place, and its tooltip.
  # {label} says what it is, {value} what it holds now.
  edit: "Edit {label}: {value}"
  confirm: "Yes, go ahead"
  qr_button: "QR code"
  qr_label: "QR code for the link above"
  show_password: "Show password"

