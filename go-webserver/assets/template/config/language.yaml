  table_keys: "Keys"
  table_buttons: "Change"
  change: "Change"
  change_named: "Change the keys for {name}"
  turn_off: "Turn off"
  turn_off_named: "Turn off the keys for {name}"
  reset: "Reset"
  reset_named: "Put back the usual keys for {name}"
  reset_all: "Put every key back"
  press_keys: "Press the new keys… (Esc to cancel)"
  off: "Off"
  or: "or"
  # {keys} is what was pressed, {other} the action that has it, {name} the one being changed.
