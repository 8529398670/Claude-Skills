# ===========================================================================
# config.example.yaml -- every setting with its default. Safe to commit: it
# has no secret key. config.yaml itself is gitignored, so a fresh clone starts
# from this file.
#
# To use it:
#
#   cp config.example.yaml config.yaml
#   chmod 600 config.yaml
#   openssl rand -hex 32        # paste the output into server.secret_key
#
# Or skip the copy: `python -m app config init` writes config.yaml with a
# fresh key already in it.
#
# This file is generated from app/core/defaults.yaml. After changing a
# default there, regenerate it with `python -m app config example`.
# ===========================================================================

