# kind_* label both the filter buttons and each row's badge.
logs:
  heading: "Logs"
  description: "Everything this app has recorded: every request, every sign-in and admin action, and what people did on the page. Only you, the owner, can see this. Typed values, passwords and links are never recorded."
  search_label: "Search"
  search_placeholder: "Search, e.g. status:5xx user:ana -kind:request"
  search_help: "Words match anywhere. Narrow with kind: user: status: path: ip: level: action: — commas mean or (kind:auth,admin), a leading minus excludes."
  kinds_label: "Show only"
  kind_request: "Request"
  kind_ui: "Page"
  kind_auth: "Sign-in"
  kind_admin: "Admin"
  kind_error: "Error"
  kind_system: "System"
  live_button: "Live"
  live_lost: "Live updates stopped. Press Live to try again."
  prune_button: "Prune now"
  # Empty this string to stop asking for confirmation.
  prune_confirm: "Apply the retention rules from config.yaml now? Old days are compressed or deleted."
  # {deleted} and {compressed} are counts of days.
  pruned: "Pruned: {deleted} days deleted, {compressed} compressed."
  # {days} {used} {max} {gzip} come from config.yaml's logs section.
  settings_line: "Keeping {days} days, up to {max} (now {used}). Days older than {gzip} are compressed."
  encrypted: "Encrypted on disk."
  not_encrypted: "Not encrypted on disk."
  dropped: "{count} entries dropped under load since start."
  empty: "Nothing has been logged yet."
  no_matches: "Nothing matches."
  entries: "entries: {count}"
  matches: "matches: {count}"
  errors: "errors: {count}"
  compressed: "compressed"
  download_button: "Download"
  delete_button: "Delete day"
  # {date} is the day. Empty this string to stop asking for confirmation.
  delete_confirm: "Delete every entry from {date}? This cannot be undone."
  load_more: "Load more"
  table_time: "Time"
  table_kind: "Kind"
  table_user: "Who"
  table_what: "What"
  table_ip: "IP"
  anonymous: "signed out"
  via_key: "(API key)"

# The Jobs screen (owner only; static/js/jobs.js). A job you add can have a
# name here, as job_<name> with dashes as underscores; one without shows its
# own name.
jobs:
  heading: "Jobs"
  description: "What this app does by itself in the background, and how each job went last. Only you, the owner, can see this."
  table_name: "Job"
  table_status: "Status"
  table_last: "Last run"
  table_next: "Next run"
  table_note: "Result"
  table_actions: "Actions"
  status_running: "Running"
  status_ok: "OK"
  status_failed: "Failed"
  status_interrupted: "Interrupted"
  status_never: "Not run yet"
  never: "Never"
  run_button: "Run now"
  job_purge: "Clear out expired records"
  job_prune_logs: "Apply log retention"
  job_backup: "Scheduled backup"

# The Settings screen (owner only; static/js/settings.js): config.yaml, one
# field per setting. Placeholders in {braces} are filled in by the page. The
# help text under each field is the comment above that key in
# config/defaults.yaml, not something set here.
settings:
  heading: "Settings"
  description: "This is config.yaml, the file that configures this app. Saving writes only what you changed into the file, keeping its comments. Each setting says when a change takes effect. The file can also be edited by hand: the server notices within a few seconds."
  file: "{file}"
  secret_note: "The secret key is in {path}. It is never shown here; back it up with the database."
  apply_live: "Live"
  apply_live_help: "Takes effect as soon as it is saved."
  apply_restart: "Restart"
  apply_restart_help: "Saved now; takes effect when the server restarts."
  apply_scripts: "Scripts"
  apply_scripts_help: "Read by docker/run.sh the next time it runs."
  # {running} is the value the server started with.
  pending_restart: "Saved. The server keeps running with {running} until it restarts."
  default: "Default: {value}"
  empty: "(empty)"
  list_help: "One per line."
  locked: "Fixed inside the container. Change it in config/config.yaml on the host."
  save_button: "Save changes"
  reload_button: "Reload from file"
  unsaved: "{count} unsaved"
  saved: "Saved."
  saved_restart: "Saved. Some changes take effect when the server restarts."
  changed_on_disk: "config.yaml was changed while you were editing (by hand, or in another tab), so nothing was saved. Reload from file to see it."
  # {error} says what is wrong with it.
  invalid_file: "config.yaml does not validate, so the server is running on the last good version. {error}"
  read_only: "The server cannot write config.yaml, so it can only be changed by editing the file by hand."
  stale: "config.yaml was replaced on the host since this container started. Restart the container to see and change the new version."

errors:
  generic: "Something went wrong. Please try again."
  # {reference} finds this failure in the Logs screen's search.
  reference: "Something went wrong on the server. Reference: {reference}"
  network: "Could not reach the server."
  # Error codes the invite link and PIN routes answer with, by name.
  invite_link_invalid: "This invite link is invalid, expired, or has been switched off."
  invite_link_full: "This link has no places left."
  no_such_account: "That account cannot sign in through this link."
  pin_needed: "Enter the PIN."
  pin_wrong: "That PIN is not right."
  pin_locked: "Too many wrong PINs. Try again in 15 minutes."
  bad_pin: "A PIN is 4 to 8 digits."
  # And the ones password and two-factor sign-in answer with.
  invalid_login: "That username or password is not right."
  login_locked: "Too many wrong tries. Try again in 15 minutes."
  use_password: "This account has a password. Open the home page and sign in with it."
  username_taken: "That username is taken."
  bad_username: "A username is 3 to 32 letters, digits, dots, dashes or underscores."
  bad_digest: "That password could not be processed."
  password_blocked: "The owner has blocked passwords for this account."
  password_too_short: "A password is at least 12 characters."
  password_mismatch: "Those two passwords are not the same."
  insecure_context: "Password sign-in needs HTTPS. Your password was not sent."
  two_factor_wrong: "That code is not right."
  two_factor_locked: "Too many wrong codes. Try again in 15 minutes."
  two_factor_on: "Two-factor sign-in is already on."
  two_factor_off: "Two-factor sign-in is not on."
  challenge_invalid: "That sign-in has expired. Start again."
  logs_today: "Today's log is still being written, so it cannot be deleted."
  # The Settings screen's save, by code.
  settings_changed: "config.yaml was changed while you were editing. Reload from file to see it."
  settings_stale: "config.yaml was replaced on the host. Restart the container first."
  settings_read_only: "The server cannot write config.yaml."
  settings_locked: "That setting cannot be changed from inside the container."
  invalid_settings: "That value is not allowed."
  unknown_setting: "There is no such setting."
  settings_hand_edit: "config.yaml is written in a way this screen cannot change. Edit the file by hand."
